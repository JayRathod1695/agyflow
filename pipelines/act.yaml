name: act
version: 1
inputs: [snapshot, context, plan, approval, locked_tests, test_manifest, baseline]
steps:
  - foreach: actors
    items: "$approval#payload.picks"
    as: ap
    max_parallel: "${project.max_parallel}"
    item_fail: continue
    steps:
      - id: pick
        block: pick-item
        in: {source: $plan, item: $ap}
        cfg: {mode: json_list, from: "payload.approaches", key: id}
      - id: wt
        block: worktree-create
        in: {snapshot: $snapshot}
        cfg: {name: "act-${item.id}", apply_dirty: "${project.allow_dirty}"}
      - id: act
        block: agent-call
        side_effects: worktree
        in: {approach: $pick.picked, context: $context, decisions: $project.decisions, wt: $wt.wt}
        out: {result: result}
        cfg: {role: actor, mode: edit, skip_permissions: "${project.actor_skip_permissions}",
              vars: {smoke_cmd: "${project.smoke_cmd}", forbidden: "${project.forbidden}"}}
        retry: {max: 1}
        timeout: "${project.actor_timeout_s}s"
      - id: patch
        block: patch-export
        in: {wt: $wt.wt, snapshot: $snapshot, approach: $pick.picked}
      - id: guard
        block: diff-guard
        in: {patch: $patch.patch, patch_meta: $patch.patch_meta, test_manifest: $test_manifest,
             approach: $pick.picked}
        cfg: {forbidden: "${project.forbidden}", allow_new_deps: false}
      - id: judge
        block: judge-run
        in: {patch: $patch.patch, patch_meta: $patch.patch_meta, snapshot: $snapshot,
             locked_tests: $locked_tests, baseline: $baseline}
        cfg: {test_cmd: "${project.test_cmd}", repeat: "${project.judge_repeat}", seeds: [11, 22, 33, 44, 55],
              metric_cmd: "${project.metric_cmd}", holdout_dir: "${project.holdout_dir}",
              timeout_s: "${project.judge_timeout_s}", required: [tests_pass, no_new_failures]}
  - id: rank
    block: rank
    in: {scores: "$actors[*].judge.score"}
    cfg: {weights: "${project.weights}", metrics: "${project.metrics}", noise_margin: "${project.noise_margin}"}
  - id: decide
    block: branch-decide
    in: {scores: "$actors[*].judge.score", ranking: $rank.ranking, index: $actors.index}
  - foreach: stress
    when: "decide.decision.action == 'stress'"
    items: "$rank.ranking#payload.ordered[*].id"
    limit: 2
    as: sp
    item_fail: continue
    steps:
      - id: spick
        block: pick-item
        in: {collection: "$actors[*].patch", item: $sp}
        cfg: {mode: collection}
      - id: smeta
        block: pick-item
        in: {collection: "$actors[*].patch_meta", item: $sp}
        cfg: {mode: collection}
      - id: sjudge
        block: judge-run
        in: {patch: $spick.picked, patch_meta: $smeta.picked, snapshot: $snapshot,
             locked_tests: $locked_tests, baseline: $baseline}
        cfg: {test_cmd: "${project.test_cmd}", repeat: "${project.stress_repeat}", seeds: [101, 202, 303, 404, 505],
              extra_cmd: "${project.stress_cmd}", holdout_dir: "${project.holdout_dir}",
              timeout_s: "${project.judge_timeout_s}", required: [tests_pass, no_new_failures]}
  - id: rank2
    block: rank
    when: "decide.decision.action == 'stress'"
    in: {scores: "$stress[*].sjudge.score"}
    cfg: {weights: "${project.weights}", metrics: "${project.metrics}", noise_margin: "${project.noise_margin}"}
  - id: sum
    block: attempt-summary
    in: {plan: $plan, scores: "$actors[*].judge.score", results: "$actors[*].act.result",
         guards: "$actors[*].guard.guard", index: $actors.index, decision: $decide.decision}
    cfg: {attempt: "${loop.iter}"}
exports:
  ranking: "$rank2.ranking || $rank.ranking"
  decision: $decide.decision
  patches: "$actors[*].patch"
  patch_metas: "$actors[*].patch_meta"
  index: $actors.index
  summary: $sum.attempt_summary
